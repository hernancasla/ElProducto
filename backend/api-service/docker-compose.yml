version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elproducto-db
    environment:
      POSTGRES_DB: elproducto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elproducto-network

  redis:
    image: redis:7-alpine
    container_name: elproducto-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - elproducto-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elproducto-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/elproducto
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - elproducto-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  elproducto-network:
    driver: bridge

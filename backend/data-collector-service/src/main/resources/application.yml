server:
  port: 8081

spring:
  application:
    name: data-collector-service

  main:
    banner-mode: console
    web-application-type: reactive

  # Configuración de R2DBC (Reactive Database)
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/elproducto_db
    username: elproducto_user
    password: elproducto_pass
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m

  # Configuración de Flyway (usa JDBC para migraciones)
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/elproducto_db
    user: elproducto_user
    password: elproducto_pass
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configuración de API-Football
api-football:
  base-url: https://v3.football.api-sports.io
  api-key: a362742c468a118c7c5cb3fe25b19b17
  timeout: 30000

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.elproducto.datacollector: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: Data Collector Service API
    description: Microservicio para recolección de datos de API-Football
    version: 0.0.1-SNAPSHOT
    contact:
      name: ElProducto Team
      email: support@elproducto.com
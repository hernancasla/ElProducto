server:
  port: 8081

spring:
  application:
    name: data-collector-service

  main:
    banner-mode: console
    web-application-type: reactive

  # Configuración de R2DBC (Reactive Database)
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/elproducto}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m

  # Configuración de Flyway (usa JDBC para migraciones)
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/elproducto}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configuración de API-Football
api-football:
  base-url: https://v3.football.api-sports.io
  api-key: a362742c468a118c7c5cb3fe25b19b17
  timeout: 30000
  # Control de quota de llamadas a la API
  quota:
    enabled: true
    daily-limit: 100  # Free plan: 100, Pro: 7500
    warning-threshold-percent: 80
    block-on-limit: true
    reset-hour-utc: 0

# Configuración de Sincronización
sync:
  enabled: false  # Habilitar en produccion
  rate-limit-delay: 200ms
  max-retries: 3
  stale-timeout: 1h
  # Configuracion por entidad (override de defaults)
  entities:
    countries:
      frequency: MANUAL
      strategy: FULL_REFRESH
      priority: 1
    leagues:
      frequency: WEEKLY
      cron: "0 0 0 * * SUN"
      strategy: UPSERT
      priority: 2
      dependencies:
        - countries
      parameters:
        countryCode: AR
    teams:
      frequency: WEEKLY
      cron: "0 0 0 * * MON"
      strategy: UPSERT
      priority: 3
      dependencies:
        - leagues
      parameters:
        country: Argentina
    players:
      frequency: WEEKLY
      cron: "0 0 0 * * TUE"
      strategy: UPSERT
      priority: 4
      dependencies:
        - teams
      parameters:
        season: 2024
    fixtures:
      frequency: DAILY
      cron: "0 0 6 * * *"
      strategy: UPSERT
      priority: 5
      dependencies:
        - leagues
      parameters:
        season: 2024
    standings:
      frequency: HOURLY
      cron: "0 0 * * * *"
      strategy: FULL_REFRESH
      priority: 6
      dependencies:
        - fixtures
      parameters:
        season: 2024
    fixture_statistics:
      frequency: EVENT_DRIVEN
      strategy: UPSERT
      priority: 7
      dependencies:
        - fixtures
    fixture_events:
      frequency: EVENT_DRIVEN
      strategy: DELETE_INSERT
      priority: 8
      dependencies:
        - fixtures
    match_lineups:
      frequency: EVENT_DRIVEN
      strategy: DELETE_INSERT
      priority: 9
      dependencies:
        - fixtures

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.elproducto.datacollector: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: Data Collector Service API
    description: Microservicio para recolección de datos de API-Football
    version: 0.0.1-SNAPSHOT
    contact:
      name: ElProducto Team
      email: support@elproducto.com